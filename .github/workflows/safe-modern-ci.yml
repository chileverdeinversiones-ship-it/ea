name: SAFE Moderno - pruebas PHP

on:
  pull_request:
    paths:
      - "safe-modern/**"
      - ".github/workflows/safe-modern-ci.yml"
  push:
    branches:
      - "modernizacion/guatemala-safe"
    paths:
      - "safe-modern/**"
      - ".github/workflows/safe-modern-ci.yml"

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php-version: ["8.4", "8.5"]
    defaults:
      run:
        working-directory: safe-modern
    steps:
      - name: Obtener código
        uses: actions/checkout@v4
      - name: Preparar PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          extensions: pdo, pdo_mysql
          coverage: none
      - name: Revisar sintaxis PHP
        run: find src public tests -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Validar configuración Composer
        run: composer validate --no-check-publish --no-check-lock
      - name: Instalar dependencias de pruebas
        run: composer install --no-interaction --prefer-dist
      - name: Ejecutar pruebas unitarias
        run: composer test
